---
- name: Multi-Subnet IPAM + GCP Provisioning
  hosts: 192.168.20.130
  gather_facts: no
  connection: ssh

  vars_files:
    - vars/common.yml
    - vars/paths.yml

  vars:
    job_status: SUCCESS
    job_error: ""

    region_map:
      AO: asia-south1
      EU: europe-west1
      AS: asia-east1
      NA: us-central1

  tasks:

    # ----------------------------
    # Pre-checks
    # ----------------------------
    - name: Fail if subnets var missing
      fail:
        msg: "Variable 'subnets' missing"
      when: subnets is not defined

    - name: Fail if subnets not list
      fail:
        msg: "'subnets' should be list"
      when: subnets is not iterable

    - name: Max 5 subnets allowed
      fail:
        msg: "Max 5 subnets allowed per execution"
      when: (subnets | length) > 5

    # ----------------------------
    # Init report
    # ----------------------------
    - name: Init subnet_report
      set_fact:
        subnet_report: []

    # ----------------------------
    # Load CSVs
    # ----------------------------
    - name: Load Env.csv
      read_csv:
        path: "{{ env_csv }}"
      register: env_data

    - name: Load Subnet.csv
      read_csv:
        path: "{{ subnet_csv }}"
      register: subnet_data

    # ----------------------------
    # Main execution block
    # ----------------------------
    - name: Process subnet requests
      block:

        - name: Process each subnet request
          include_tasks: subnet_unit.yml
          loop: "{{ subnets }}"
          loop_control:
            loop_var: req

      rescue:

        - name: Capture failure details
          set_fact:
            job_status: FAILED
            job_error: >-
              {{
                ansible_failed_result.msg
                  | default(ansible_failed_result.stderr, true)
                  | default('Unknown error occurred')
              }}

      always:

        - name: Send SUCCESS / FAILURE mail
          mail:
            host: smtp.gmail.com
            port: 587
            secure: starttls
            username: "{{ email_user }}"
            password: "{{ email_password }}"
            to: "{{ email_to }}"
            subject: "GCP Subnet Automation – {{ job_status }}"
            body: |
              Project : {{ gcp_project }}
              Status  : {{ job_status }}

              {% if job_status == 'FAILED' %}
              Error:
              {{ job_error }}
              {% else %}
              Subnet creation completed successfully.
              {% endif %}

        - name: Write subnet report CSV (only on success)
          when: job_status == 'SUCCESS'
          copy:
            dest: "{{ report_csv }}"
            content: |
              Project,Region,Env,VPC,Subnet,CIDR,Status
              {% for r in subnet_report %}
              {{ r.project }},{{ r.region }},{{ r.env }},{{ r.vpc }},{{ r.subnet }},{{ r.cidr }},{{ r.status }}
              {% endfor %}
